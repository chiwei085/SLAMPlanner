bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom
    # rtabmap_map_tf_relay publishes map->odom at 50 Hz (≤20 ms latency),
    # so the old 1.0 s stall-absorption value is no longer needed. 0.3 s
    # is a small safety net against any unexpected TF hiccup.
    transform_tolerance: 0.3
    # Humble renamed this from default_bt_xml_filename to
    # default_nav_to_pose_bt_xml. r2_navigation_launch.py's RewrittenYaml
    # param_rewrites already targets the new key name, but RewrittenYaml only
    # rewrites leaf keys that already exist in the source YAML -- it never
    # inserts missing ones. With the old key name still here, the rewrite had
    # nothing to match, so bt_navigator silently fell back to its own
    # compiled-in default (the stock navigate_to_pose_w_replanning_and_recovery.xml,
    # whose RoundRobin recovery contains Spin(1.57) = phantom left turns)
    # instead of navigate_to_pose_rgbd.xml. See memory: stock-bt-loaded-param-rename.
    default_nav_to_pose_bt_xml: "navigate_to_pose_rgbd.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 6.283185
      stateful: True

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.10
      lookahead_dist: 0.35
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.55
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.45
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      # Must mirror local_costmap inflation_layer (0.45 / 3.0) so the
      # cost->distance inversion inside the cost-regulated scaling is exact.
      cost_scaling_dist: 0.45
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      regulated_linear_scaling_min_radius: 0.50
      regulated_linear_scaling_min_speed: 0.05
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.35
      use_rotate_to_heading: false
      allow_reversing: true
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 0.3
      max_angular_accel: 0.5
      # rtabmap_map_tf_relay decouples map->odom publishing from the SLAM
      # graph-optimization mutex; the relay runs at 50 Hz so FollowPath
      # never sees a stale transform. 0.3 s provides a small safety margin.
      transform_tolerance: 0.3
      max_robot_pose_search_dist: 2.0
      use_interpolation: true

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      # rtabmap_map_tf_relay keeps map->odom fresh at 50 Hz, eliminating the
      # phantom-SUCCEEDED bug caused by the transform failing silently under
      # load (run_20260707_fix notes). 0.3 s is a conservative safety net.
      transform_tolerance: 0.3
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.19, 0.115], [0.19, -0.115], [-0.19, -0.115], [-0.19, 0.115]]"
      footprint_padding: 0.02
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Weighted inflation for the local window: steep near obstacles,
        # gentle tail out to 0.45 m so RPP's cost-regulated velocity scaling
        # sees a smooth gradient (it slows near obstacles instead of hitting
        # a cost cliff). cost_scaling_factor must stay in sync with
        # FollowPath.inflation_cost_scaling_factor.
        inflation_radius: 0.45
        cost_scaling_factor: 3.0
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        # 16 voxels is the VoxelLayer maximum. 0.0625 m x 16 = 1.0 m keeps the
        # dual-mode high Astra (optical centre ~0.89 m) inside the grid;
        # at 0.05 (0.8 m) raytrace clearing failed with "Sensor origin ...
        # out of map bounds" ~24 times/s.
        z_resolution: 0.0625
        z_voxels: 16
        max_obstacle_height: 0.8
        mark_threshold: 0
        # depth_cloud = high Astra, d455_cloud = low D455 (floor-level).
        observation_sources: depth_cloud d455_cloud
        d455_cloud:
          topic: /realsense/d455/depth/points_voxel_base
          sensor_frame: d455_depth_optical_frame
          obstacle_min_range: 0.2
          obstacle_max_range: 1.5
          raytrace_min_range: 0.2
          raytrace_max_range: 2.0
          # D455 floor noise reaches ~0.02 m after extrinsic calibration;
          # 0.01 marked bare floor. 0.03 drops it (and ~1 cm cables).
          min_obstacle_height: 0.03
          max_obstacle_height: 0.8
          observation_persistence: 0.4
          clearing: True
          marking: True
          data_type: "PointCloud2"
          inf_is_valid: True
        depth_cloud:
          topic: /camera/depth/points_voxel_base
          # depth_cloud_preprocessor pre-transforms points into base_footprint
          # and rewrites header.frame_id accordingly. Without sensor_frame set,
          # ObservationBuffer would use that rewritten frame_id as the raytrace
          # origin (0,0,0 of base_footprint = ground-level robot center) instead
          # of the camera's real elevated, forward-offset position, corrupting
          # the clearing geometry that low chair-leg detection depends on.
          sensor_frame: camera_depth_optical_frame
          obstacle_min_range: 0.2
          obstacle_max_range: 1.5
          raytrace_min_range: 0.2
          raytrace_max_range: 2.0
          min_obstacle_height: 0.01
          max_obstacle_height: 0.8
          observation_persistence: 0.4
          clearing: True
          marking: True
          data_type: "PointCloud2"
          inf_is_valid: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      # rtabmap_map_tf_relay provides fresh map->odom at 50 Hz (see local_costmap).
      transform_tolerance: 0.3
      footprint: "[[0.19, 0.115], [0.19, -0.115], [-0.19, -0.115], [-0.19, 0.115]]"
      footprint_padding: 0.02
      resolution: 0.05
      # depth_voxel_layer runs after static_layer so its raytrace clearing
      # overrides static obstacles that the robot observes as free space.
      # This breaks the one-way ratchet: SLAM grid cells marked occupied by
      # a past node can be cleared when the robot drives past and the depth
      # cloud ray hits the same cell.  observation_persistence: 0.0 means
      # each update starts from a clean slate (no carry-over marking), which
      # gives clearing rays the maximum opportunity to remove stale obstacles.
      plugins: ["static_layer", "depth_voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      depth_voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        # 16 voxels is the VoxelLayer maximum. 0.0625 m x 16 = 1.0 m keeps the
        # dual-mode high Astra (optical centre ~0.89 m) inside the grid;
        # at 0.05 (0.8 m) raytrace clearing failed with "Sensor origin ...
        # out of map bounds" ~24 times/s.
        z_resolution: 0.0625
        z_voxels: 16
        max_obstacle_height: 0.8
        mark_threshold: 0
        observation_sources: depth_cloud d455_cloud
        d455_cloud:
          topic: /realsense/d455/depth/points_voxel_base
          sensor_frame: d455_depth_optical_frame
          obstacle_min_range: 0.2
          obstacle_max_range: 4.0
          raytrace_min_range: 0.2
          raytrace_max_range: 5.0
          min_obstacle_height: 0.05
          max_obstacle_height: 0.8
          observation_persistence: 0.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
        depth_cloud:
          topic: /camera/depth/points_voxel_base
          # See local_costmap voxel_layer comment: without sensor_frame, the
          # raytrace origin would come from the preprocessor's rewritten
          # base_footprint header instead of the real camera pose.
          sensor_frame: camera_depth_optical_frame
          obstacle_min_range: 0.2
          obstacle_max_range: 4.0
          raytrace_min_range: 0.2
          raytrace_max_range: 5.0
          min_obstacle_height: 0.05
          max_obstacle_height: 0.8
          observation_persistence: 0.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          inf_is_valid: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Weighted (non-uniform) inflation. The previous radius (0.11) was
        # smaller than the footprint's inscribed radius (~0.135 m: half-width
        # 0.115 + padding 0.02), so there was NO cost gradient at all -- one
        # cell past an obstacle the cost dropped straight to 0 and Smac had no
        # reason to prefer corridor centers over corner-hugging paths.
        # cost(d) = 252 * exp(-3.5 * (d - 0.135)):
        #   d=0.20 m -> 200   (steep repulsion right next to obstacles)
        #   d=0.30 m -> 141   (center of a 0.6 m doorway: costly but passable)
        #   d=0.55 m -> ~59   (gentle tail that pulls paths toward open space)
        # The gradient never reaches INSCRIBED (253) outside the true
        # collision zone, so narrow passages stay plannable -- unlike the old
        # oversized-radius attempt that saturated whole corridors.
        cost_scaling_factor: 3.5
        inflation_radius: 0.55
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      # Path end may fall this far short of the goal, and the goal checker
      # then accepts xy_goal_tolerance (0.35) around that end. Keep the sum at
      # the explorer's nav2_success_xy_tolerance_m (0.55), or Nav2 reports
      # success for an unreachable goal 0.55-0.85 m away.
      tolerance: 0.2
      allow_unknown: true
      downsample_costmap: false
      downsampling_factor: 1
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 2.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      minimum_turning_radius: 0.50
      reverse_penalty: 5.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      # Raised from 2.0 alongside the weighted global inflation gradient:
      # the gradient only steers paths to corridor centers if the planner
      # actually weighs traversal cost against path length.
      cost_penalty: 2.5
      retrospective_penalty: 0.015
      lookup_table_size: 10.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      use_quadratic_cost_penalty: false
      downsample_obstacle_heuristic: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_timeout: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.45
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.11, 0.0, 1.0]
    min_velocity: [-0.08, 0.0, -1.0]
    max_accel: [0.08, 0.0, 0.5]
    max_decel: [-0.08, 0.0, -0.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.001, 0.0, 0.001]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    transform_tolerance: 0.2
    source_timeout: 1.0
    stop_pub_timeout: 1.0
    cmd_vel_in_topic: "cmd_vel_smoothed_raw"
    cmd_vel_out_topic: "/alc/nav_cmd_vel"
    state_topic: "collision_monitor_state"
    # Three-stage depth braking (replaces the old custom r2_collision_safety_gate
    # velocity governor). The monitor evaluates every polygon each cycle and
    # applies the most restrictive result, all from the same persistent depth
    # cloud, so braking is smooth instead of an on/off stop:
    #   ApproachZone - time-to-collision scaling: cap speed so the robot can
    #                  always halt time_before_collision seconds before contact.
    #   SlowdownZone - fixed ratio cut once an obstacle enters the mid band.
    #   StopPolygon  - hard stop at the inner band. Its front edge (~0.25 m)
    #                  is matched to the camera's RangeMin so the robot is
    #                  already stopped by the time the obstacle enters the
    #                  near blind zone (sub-0.25 m / pure-rotation gaps are
    #                  covered by the stall detector, not this monitor).
    polygons: ["StopPolygon", "SlowdownZone", "ApproachZone"]
    StopPolygon:
      type: "polygon"
      points: [0.25, 0.14, 0.25, -0.14, -0.12, -0.14, -0.12, 0.14]
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: "collision_monitor/stop_polygon"
    SlowdownZone:
      type: "polygon"
      points: [0.45, 0.16, 0.45, -0.16, -0.12, -0.16, -0.12, 0.16]
      action_type: "slowdown"
      min_points: 4
      slowdown_ratio: 0.4
      visualize: true
      polygon_pub_topic: "collision_monitor/slowdown_polygon"
    ApproachZone:
      type: "polygon"
      # Robot footprint, projected forward along the commanded velocity.
      points: [0.19, 0.115, 0.19, -0.115, -0.19, -0.115, -0.19, 0.115]
      action_type: "approach"
      min_points: 6
      time_before_collision: 2.0
      simulation_time_step: 0.1
      visualize: true
      polygon_pub_topic: "collision_monitor/approach_polygon"
    observation_sources: ["depth_cloud", "d455_cloud"]
    depth_cloud:
      type: "pointcloud"
      topic: "/camera/depth/points_voxel_base"
      min_height: 0.01
      max_height: 0.8
      enabled: true
    d455_cloud:
      type: "pointcloud"
      topic: "/realsense/d455/depth/points_voxel_base"
      min_height: 0.03  # above D455 floor noise, see local_costmap d455_cloud
      max_height: 0.8
      enabled: true

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
